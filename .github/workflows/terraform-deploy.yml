name: Terraform Manual Deploy or Destroy

on:
  workflow_dispatch:
    inputs:
      # environment:
      #   description: "Select environment to deploy (dev, stage, main)"
      #   required: true
      #   default: "dev"
      #   type: choice
      #   options:
      #     - dev
      #     - stage
      #     - main
      action:
        description: "Select action to perform (apply or destroy)"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action }} on ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest

    env:
      TF_WORKING_DIR: ./Terraform/config
      AWS_REGION: us-east-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # # 🔹 Set environment-specific AWS credentials
      # - name: Set AWS credentials
      #   run: |
      #     if [ "${{ github.event.inputs.environment }}" == "dev" ]; then
      #       echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_DEV }}" >> $GITHUB_ENV
      #       echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}" >> $GITHUB_ENV
      #     elif [ "${{ github.event.inputs.environment }}" == "stage" ]; then
      #       echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_STAGE }}" >> $GITHUB_ENV
      #       echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_STAGE }}" >> $GITHUB_ENV
      #     elif [ "${{ github.event.inputs.environment }}" == "main" ]; then
      #       echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_PROD }}" >> $GITHUB_ENV
      #       echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}" >> $GITHUB_ENV
      #     fi

      - name: Set environment-specific AWS credentials
        run: |
          BRANCH="${GITHUB_REF##*/}"
          echo "Current branch: $BRANCH"

          if [ "$BRANCH" == "main" ]; then
            echo "Using DEV AWS credentials"
            echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_DEV }}" >> $GITHUB_ENV
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}" >> $GITHUB_ENV
          elif [ "$BRANCH" == "stage" ]; then
            echo "Using STAGE AWS credentials"
            echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_STAGE }}" >> $GITHUB_ENV
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_STAGE }}" >> $GITHUB_ENV
          elif [ "$BRANCH" == "dev" ]; then
            echo "Using PROD AWS credentials"
            echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_PROD }}" >> $GITHUB_ENV
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}" >> $GITHUB_ENV
          else
            echo "⚠️ Unknown branch: $BRANCH"
            exit 1
          fi

      - name: Verify AWS credentials
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} init

      - name: Terraform Validate
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} validate

      - name: Terraform Plan
        if: github.event.inputs.action == 'apply'
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} plan

      # # 🔹 Manual approval before any changes
      # - name: Await manual approval
      #   if: github.event.inputs.action == 'apply'
      #   uses: trstringer/manual-approval@v1
      #   with:
      #     secret: ${{ github.token }}
      #     approvers: your-github-username
      #     issue-title: "Manual approval for Terraform ${{ github.event.inputs.action }} in ${{ github.event.inputs.environment }}"
      #     issue-body: "Approve or reject the Terraform run."

      # 🔹 Apply stage
      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} apply -auto-approve

      # 🔹 Destroy stage
      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} destroy -auto-approve
