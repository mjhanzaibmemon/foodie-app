# .github/workflows/deploy.yml
name: Build & Deploy (Coolify)

on:
  push:
    branches: [staging, main]

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  IMAGE_TAG: ${{ github.sha }}
  # 👇 GHCR owner must be lowercase for Docker.
  OWNER: etra-ventures

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build & push PHP
        uses: docker/build-push-action@v6
        with:
          context: ./php
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/foodie-php:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/foodie-php:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Uncomment if/when you add a worker image 
      # - name: Build & push Worker
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: ./worker
      #     push: true
      #     tags: |
      #       ${{ env.REGISTRY }}/${{ env.OWNER }}/foodie-worker:${{ env.IMAGE_TAG }}
      #       ${{ env.REGISTRY }}/${{ env.OWNER }}/foodie-worker:latest
      #     cache-from: type=gha
      #     cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Trigger Coolify deploy (staging)
        if: github.ref == 'refs/heads/staging'
        run: |
          curl -fsSL -X POST "${{ secrets.COOLIFY_DEPLOY_HOOK_URL_STAGING }}" \
            -H "Content-Type: application/json" \
            -d "{\"IMAGE_TAG\":\"${{ env.IMAGE_TAG }}\"}"

      - name: Trigger Coolify deploy (prod)
        if: github.ref == 'refs/heads/main'
        run: |
          curl -fsSL -X POST "${{ secrets.COOLIFY_DEPLOY_HOOK_URL_PROD }}" \
            -H "Content-Type: application/json" \
            -d "{\"IMAGE_TAG\":\"${{ env.IMAGE_TAG }}\"}"

      # Optional smoke checks
      # - name: Smoke (staging)
      #   if: github.ref == 'refs/heads/staging' && secrets.HEALTHCHECK_URL_STAGING != ''
      #   run: curl -fsSL --retry 10 --retry-delay 3 "${{ secrets.HEALTHCHECK_URL_STAGING }}"
      # - name: Smoke (prod) 
      #   if: github.ref == 'refs/heads/main' && secrets.HEALTHCHECK_URL_PROD != ''
      #   run: curl -fsSL --retry 10 --retry-delay 3 "${{ secrets.HEALTHCHECK_URL_PROD }}"
