version: "3.9"

networks:
  proxy:
    external: true

volumes:
  mysql_data: {}

services:

  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    environment:
      - LSWS_ADMIN_USER=admin
      - LSWS_ADMIN_PASS=admin
    labels:
      - traefik.enable=true
      - traefik.http.routers.php.rule=Host(`foodie.app`)
      - traefik.http.routers.php.entrypoints=websecure
      - traefik.http.routers.php.tls=true
      - traefik.http.routers.php.tls.certresolver=myresolver
      - traefik.http.services.php.loadbalancer.server.port=8088
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      PMA_ABSOLUTE_URI: https://phpmyadmin.foodie.app/
      UPLOAD_LIMIT: 64M
    labels:
      - traefik.enable=true
      - traefik.http.routers.pma.rule=Host(`phpmyadmin.foodie.app`)
      - traefik.http.routers.pma.entrypoints=websecure
      - traefik.http.routers.pma.tls=true
      - traefik.http.routers.pma.tls.certresolver=myresolver
      - traefik.http.services.pma.loadbalancer.server.port=80
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
