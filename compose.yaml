networks:
  proxy:
    external: true

volumes:
  mysql_data: {}
  traefik_letsencrypt: {}

services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      # Let's Encrypt (HTTP-01)
      - --certificatesresolvers.le.acme.email=${LE_EMAIL}
      - --certificatesresolvers.le.acme.httpChallenge.entryPoint=web
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - proxy

  php:
    image: ghcr.io/etra-ventures/foodie-litespeed:${IMAGE_TAG}
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.php.rule=Host(`${PHP_HOST}`)
      - traefik.http.routers.php.entrypoints=websecure
      - traefik.http.routers.php.tls.certresolver=le
      - traefik.http.services.php.loadbalancer.server.port=80
    networks:
      - proxy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      PMA_ABSOLUTE_URI: https://${PMA_HOST}/
      UPLOAD_LIMIT: 64M
    labels:
      - traefik.enable=true
      - traefik.http.routers.pma.rule=Host(`${PMA_HOST}`)
      - traefik.http.routers.pma.entrypoints=websecure
      - traefik.http.routers.pma.tls.certresolver=le
      - traefik.http.services.pma.loadbalancer.server.port=80
      # 🔒 Choose ONE protection method (recommended: IP allowlist or Basic Auth)
      # IP allowlist (example: office + home)
      # - traefik.http.middlewares.pma-allow.ipwhitelist.sourcerange=203.0.113.10/32,198.51.100.0/24
      # - traefik.http.routers.pma.middlewares=pma-allow
      # Basic Auth (use htpasswd to generate)
      # - traefik.http.middlewares.pma-auth.basicauth.users=user:$$apr1$$<salt>$$<hash>
      # - traefik.http.routers.pma.middlewares=pma-auth
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
    networks:
      - proxy
