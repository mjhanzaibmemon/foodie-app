version: "3.8"

services:
  php:
    image: ghcr.io/etra-ventures/foodie-php:${IMAGE_TAG}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.routers.php.rule=Host(`${PHP_HOST}`)
      - traefik.http.routers.php.entrypoints=websecure
      - traefik.http.routers.php.tls=true
      - traefik.http.services.php.loadbalancer.server.port=9000
    environment:
      APP_ENV: production
      DB_HOST: db
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

  nodejs:
    image: ghcr.io/etra-ventures/foodie-nodejs:${IMAGE_TAG}
    depends_on:
      - php
    labels:
      - traefik.enable=true
      - traefik.http.routers.nodejs.rule=Host(`${NODE_HOST}`)
      - traefik.http.routers.nodejs.entrypoints=websecure
      - traefik.http.routers.nodejs.tls=true
      - traefik.http.services.nodejs.loadbalancer.server.port=3000
    environment:
      NODE_ENV: production
      API_URL: https://${PHP_HOST}

  worker:
    image: ghcr.io/etra-ventures/foodie-worker:${IMAGE_TAG}
    depends_on:
      - php
      - redis

  redis:
    image: redis:7
    command: ["redis-server","--appendonly","yes"]

  db:
    image: mysql:8.0
    command: [
      "mysqld",
      "--default-authentication-plugin=mysql_native_password",
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci"
    ]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL","mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_LIMIT: 64M
    labels:
      - traefik.enable=true
      - traefik.http.routers.phpmyadmin.rule=Host(`${PMA_HOST}`)
      - traefik.http.routers.phpmyadmin.entrypoints=websecure
      - traefik.http.routers.phpmyadmin.tls=true
      - traefik.http.services.phpmyadmin.loadbalancer.server.port=80

volumes:
  mysql_data: {}
