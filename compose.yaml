version: "3.9"

services:
  php: # OpenLiteSpeed serving your PHP app
    image: ghcr.io/etra-ventures/foodie-litespeed:${IMAGE_TAG}
    restart: unless-stopped
    # (your env/volumes/labels here)
    labels:
      - traefik.enable=true
      - traefik.http.routers.php.rule=Host(`${PHP_HOST}`)
      - traefik.http.routers.php.entrypoints=websecure
      - traefik.http.routers.php.tls=true
      - traefik.http.services.php.loadbalancer.server.port=80

  nodejs:
    image: ghcr.io/etra-ventures/foodie-nodejs:${IMAGE_TAG}
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.node.rule=Host(`${NODE_HOST}`)
      - traefik.http.routers.node.entrypoints=websecure
      - traefik.http.routers.node.tls=true
      - traefik.http.services.node.loadbalancer.server.port=3000

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    # 🚫 No 'ports:' → internal-only

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db                   # connect to internal MySQL service
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      PMA_ABSOLUTE_URI: https://${PMA_HOST}/
      UPLOAD_LIMIT: 64M
      # Optional: allow connecting to other servers from the UI
      # PMA_ARBITRARY: 1
      # Optional: stronger cookie encryption
      # PMA_PMADB: phpmyadmin
      # PHP_UPLOAD_MAX_FILESIZE: 64M
    labels:
      - traefik.enable=true
      - traefik.http.routers.pma.rule=Host(`${PMA_HOST}`)
      - traefik.http.routers.pma.entrypoints=websecure
      - traefik.http.routers.pma.tls=true
      - traefik.http.services.pma.loadbalancer.server.port=80
      # 🔒 Add one of the protections below (Basic Auth or IP allowlist)
      # - traefik.http.middlewares.pma-auth.basicauth.users=user:$$apr1$$hash$$saltedhash
      # - traefik.http.routers.pma.middlewares=pma-auth
      # or
      # - traefik.http.middlewares.pma-allow.ipwhitelist.sourcerange=YOUR.IP.BLOCK/32
      # - traefik.http.routers.pma.middlewares=pma-allow
    # Optional runtime caps so it never hogs the box
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

volumes:
  mysql_data: {}
