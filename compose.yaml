version: "3.9"

networks:
  proxy:
    external: true

volumes:
  mysql_data: {}

services:
  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    # Optional: You can remove the ports block if you only want Traefik to expose it
    # ports:
    #   - "8081:8088"
    environment:
      - LSWS_ADMIN_USER=admin
      - LSWS_ADMIN_PASS=admin
    labels:
      - traefik.enable=true
      - traefik.http.routers.php.rule=Host(`foodie.app`)
      - traefik.http.routers.php.entrypoints=websecure
      - traefik.http.routers.php.tls=true
      - traefik.http.services.php.loadbalancer.server.port=8088
    networks:
      - proxy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - proxy

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      PMA_ABSOLUTE_URI: https://${PMA_HOST}/
      UPLOAD_LIMIT: 64M
    labels:
      - traefik.enable=true
      - traefik.http.routers.pma.rule=Host(`phpmyadmin.foodie.app`)
      - traefik.http.routers.pma.entrypoints=websecure
      - traefik.http.routers.pma.tls=true
      - traefik.http.routers.pma.tls.certresolver=myresolver
      - traefik.http.services.pma.loadbalancer.server.port=80
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
    networks:
      - proxy
